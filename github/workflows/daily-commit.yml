name: Daily README Update

on:
  schedule:
    - cron: '0 0 * * *'   # tous les jours à minuit UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update "Last updated" timestamp in README
        run: |
          NOW=$(date -u '+%d %B %Y, %H:%M UTC')
          sed -i "s|<!--START_SECTION:last-updated-->.*<!--END_SECTION:last-updated-->|<!--START_SECTION:last-updated-->\n🕒 **Last updated:** ${NOW}\n<!--END_SECTION:last-updated-->|" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update last-updated timestamp"
          git push
