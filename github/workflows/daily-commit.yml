name: Daily Auto Commit

on:
  schedule:
    - cron: '0 0 * * *'   # tous les jours à minuit UTC
  workflow_dispatch:        # permet de le lancer manuellement aussi

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          echo "<!-- Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC') -->" > .last-update
          cat .last-update

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-update
          git diff --staged --quiet || git commit -m "chore: daily auto-update"
          git push
