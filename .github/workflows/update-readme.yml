name: Update README

on:
  schedule:
    - cron: '0 20 * * *'  # tous les jours à 20h UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          DATE=$(date '+%d/%m/%Y à %H:%M UTC')
          python3 -c "
          import re
          with open('README.md', 'r') as f:
              content = f.read()
          new_section = f'<!--START_SECTION:update-->\n🕒 Dernière mise à jour automatique : **${DATE}**\n<!--END_SECTION:update-->'
          content = re.sub(
              r'<!--START_SECTION:update-->.*?<!--END_SECTION:update-->',
              new_section,
              content,
              flags=re.DOTALL
          )
          with open('README.md', 'w') as f:
              f.write(content)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔄 Update README - $(date '+%Y-%m-%d')" || echo "Rien à commit"
          git push
